[project]
name = "agenticrag"
version = "0.1.0"
description = "A financial document RAG project with verifiable sources and repeatable evaluation."
readme = "README.md"
authors = [
    { name = "Demian", email = "1686627320@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langsmith>=0.3.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pymupdf>=1.28.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
agenticrag = "agenticrag:main"
agenticrag-parse-pdf = "agenticrag.ingestion.parse_pdf:main"
agenticrag-build-corpus = "agenticrag.ingestion.batch_parse:main"
agenticrag-chunk-corpus = "agenticrag.ingestion.chunk:main"
agenticrag-index-milvus = "agenticrag.ingestion.index_milvus:main"
agenticrag-index-bm25 = "agenticrag.ingestion.index_bm25:main"
agenticrag-search = "agenticrag.retrieval.search:main"
agenticrag-search-bm25 = "agenticrag.retrieval.search_bm25:main"
agenticrag-search-hybrid = "agenticrag.retrieval.search_hybrid:main"
agenticrag-search-reranker = "agenticrag.retrieval.search_reranker:main"
agenticrag-eval-retrieval = "eval.retrieval_runner:main"
agenticrag-eval-ragas = "eval.ragas.runner:main"
agenticrag-eval-v1-2-control = "eval.v1_2_control_runner:main"
agenticrag-benchmark-embedding = "eval.embedding_benchmark:main"
agenticrag-embedding-compatibility = "eval.embedding_compatibility:main"
agenticrag-document-embedding-compatibility = "eval.document_embedding_compatibility:main"
agenticrag-benchmark-document-embedding = "eval.document_embedding_benchmark:main"
agenticrag-eval-v2-planning = "eval.v2.planning:main"
agenticrag-ask = "agenticrag.rag.ask:main"

[project.optional-dependencies]
embeddings = [
    "langchain-huggingface>=1.0,<2.0",
    "sentence-transformers>=5.0,<6.0",
]
milvus = [
    "langchain-milvus>=0.3,<1.0",
]
generation = [
    "langchain-openai>=1.0,<2.0",
]
evaluation = [
    "ragas==0.4.3",
    # RAGAS 0.4.3 still imports the legacy VertexAI module removed in 0.4.x.
    "langchain-community==0.3.31",
]
reranking = [
    "FlagEmbedding==1.4.2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
